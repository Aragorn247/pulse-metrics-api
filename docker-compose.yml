services:
  db:
    image: postgres:15-alpine
    container_name: pulse_postgres
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      POSTGRES_DB: ${DB_NAME:-pulse_db}
    ports:
      - "5433:5432"  # Mapeamos al puerto 5433 en tu PC para no chocar con el 5432 del campamento
    volumes:
      - pulse_postgres_data:/var/lib/postgresql/data
    restart: always

  redis:
    image: redis:7-alpine
    container_name: pulse_redis
    ports:
      - "6380:6379"  # Mapeamos al puerto 6380 para evitar conflictos con Redis por defecto
    restart: always

  web:
    build: .
    container_name: pulse_fastapi
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./app:/app/app
    ports:
      - "8001:8000"  # Exponemos FastAPI en el puerto 8001 de tu PC (el campamento usaba otros)
    environment:
      - DATABASE_URL=postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-postgres}@db:5432/${DB_NAME:-pulse_db}
      - REDIS_URL=redis://redis:6379/0
    depends_on:
      - db
      - redis
    restart: always

volumes:
  pulse_postgres_data: